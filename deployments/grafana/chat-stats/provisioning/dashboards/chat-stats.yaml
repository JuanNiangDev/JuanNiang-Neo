# Grafana Dashboard provisioning：自动加载挂载到 /var/lib/grafana/dashboards 的面板
# （chat-stats/dashboards、juanniang-dashboard.json、juan-niang-traces.json）
apiVersion: 1

providers:
  - name: juanniang
    orgId: 1
    folder: JuanNiang-Neo
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
