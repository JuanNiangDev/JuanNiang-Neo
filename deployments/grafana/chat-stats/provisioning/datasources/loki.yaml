# Grafana 数据源 provisioning：Loki（聊天统计）/ Tempo（追踪）自动注册
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
