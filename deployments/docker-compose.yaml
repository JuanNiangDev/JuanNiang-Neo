# JuanNiang-Neo Docker Compose 编排
#
# 启动整套: docker compose up -d --build
# 停止:    docker compose down
# 日志:    docker compose logs -f juan-niang-neo
#
# 默认账号: admin / Admin123 (首次登录后请立即在 Web 面板修改)。
# 暴露端口:
#   8081 -> OneBot11 反向 WebSocket 服务端
#   8090 -> Web 管理面板 + API

name: juanniang-neo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-juan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juanniang-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-root}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - juanniang-net

  juan-niang-neo:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8081:8081"
      - "8090:8090"
    environment:
      WEB_DIR: /app/web/dist
      OB_PORT: "8081"
      API_ADDR: ":8090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-juan}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OB_TOKEN: ${OB_TOKEN:-}
      OB_ADMINS: ${OB_ADMINS:-}
      # 链路追踪（Grafana Tempo）：OTLP HTTP 直推；留空 = 禁用（no-op 零开销）
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318"
      OTEL_SERVICE_NAME: juan-niang-neo
      # 采样率（0~1，默认 1.0 全量；热聊群量大可调低）
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
      # 根 span 是否记录消息内容（截断 100 字符；敏感环境可关）
      OTEL_TRACE_CAPTURE_CONTENT: "true"
      # 群消息/回复统计（Loki+Promtail 通道，独立于主日志）：NDJSON 追加到 data/stats/chat-events.log，
      # promtail 采集后推送 loki。置 false 可关闭（不写盘）。
      STATS_ENABLED: "true"
      STATS_PATH: /app/data/stats/chat-events.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 整个 data 目录挂载，跨升级/重建保留（容器内 CWD=/app -> /app/data）：
      #   data/pluggins           Lua 插件（启动时自动写入内嵌 SDK 与 system 插件）
      #   data/imgs                图床图片
      #   data/plugin_store.json   插件商店配置（镜像源选择/自定义镜像/仓库地址）
      #
      # ⚠️ 首次启动前建议先在宿主机创建 data 目录并赋写权限（app 启动时会把
      # 内嵌的 SDK 与 system 插件写入 data/pluggins；当前镜像以 root 运行，
      # 若后续改为非 root 用户则必须赋权）：
      #   mkdir -p data && chmod 777 data
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - juanniang-net

  # 链路追踪存储（Grafana Tempo）：Grafana 添加 Tempo 数据源 http://tempo:3200
  # 后，Explore → Tempo 按 service.name=juan-niang-neo 查看单事件全流程瀑布图。
  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" # Tempo HTTP（Grafana 数据源）
      - "4318:4318" # OTLP HTTP（机器人 span 上报）
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    networks:
      - juanniang-net

  # 日志存储（Loki）：群消息/回复统计明细，保留 7 天（deployments/loki.yaml）。
  # Grafana 添加数据源 http://loki:3100 → Explore 按 {job="juanniang"} 查询。
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100" # Loki HTTP（Grafana 数据源 / promtail 推送）
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml
      - loki-data:/loki
    networks:
      - juanniang-net

  # 日志采集（Promtail）：采集 juan-niang-neo 写入的统计 NDJSON（/app/data/stats ↔ /data 同源），
  # 解析 group_id/direction/source 为 label 后推送 loki。
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./promtail-chat-stats.yaml:/etc/promtail/config.yaml:ro
      - ../data:/data:ro            # 只读采集统计文件（与 juan-niang-neo 的 /app/data 同源）
      - promtail-positions:/tmp     # 采集偏移持久化（重启不重推）
    depends_on:
      - loki
    networks:
      - juanniang-net

  # 可视化（Grafana）：provisioning 自动注册 Loki/Tempo 数据源 + 聊天统计面板；
  # 访问 http://localhost:3000（默认 admin/admin，首次登录建议改密）。
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana Web UI
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro # 数据源 + dashboard provider
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro   # 面板 JSON（chat-stats.json）
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
    networks:
      - juanniang-net

volumes:
  pgdata:
  tempo-data:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  juanniang-net:
    driver: bridge