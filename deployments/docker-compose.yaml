# JuanNiang-Neo Docker Compose 编排
#
# 启动整套: docker compose up -d --build
# 停止:    docker compose down
# 日志:    docker compose logs -f juan-niang-neo
#
# 默认账号: admin / Admin123 (首次登录后请立即在 Web 面板修改)。
# 暴露端口:
#   8081 -> OneBot11 反向 WebSocket 服务端
#   8090 -> Web 管理面板 + API

name: juanniang-neo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-juan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juanniang-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-root}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - juanniang-net

  juan-niang-neo:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8081:8081"
      - "8090:8090"
    environment:
      WEB_DIR: /app/web/dist
      OB_PORT: "8081"
      API_ADDR: ":8090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-juan}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OB_TOKEN: ${OB_TOKEN:-}
      OB_ADMINS: ${OB_ADMINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Lua 插件目录 (convention: data/pluggins/<name>/{main.lua,pluggin.yaml})
      # 容器内二进制 CWD=/app, 硬编码加载 "data/pluggins" -> /app/data/pluggins。
      - ../data/pluggins:/app/data/pluggins
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - juanniang-net

volumes:
  pgdata:

networks:
  juanniang-net:
    driver: bridge